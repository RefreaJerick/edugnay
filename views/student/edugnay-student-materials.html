<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EdUgnay</title>
  <link rel="icon" href="../../assets/images/edUgnay-logo-circle.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/student/materials.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* EJS NOTE: moves to assets/css/student/materials.css. Uses shared tokens only —
       no new color system, consistent with dashboard/grades pages already converted. */

    /* ── Subject tabs — same pill-tab pattern as journals/grades pages ── */
    .subject-tab-bar {
      display: flex; align-items: center; gap: 2px;
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: 12px; padding: 5px; margin-bottom: 20px;
      overflow-x: auto;
    }
    .subject-tab {
      flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 9px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600;
      color: var(--gray-500); cursor: pointer; border: none; background: transparent;
      transition: all 0.15s; white-space: nowrap;
    }
    .subject-tab:hover { background: var(--gray-100); color: var(--gray-700); }
    .subject-tab.active { background: var(--blue); color: var(--white); box-shadow: 0 2px 8px rgba(26,64,128,0.25); }
    .subject-tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .subject-tab:not(.active) .subject-tab-dot { opacity: 0.45; }
    .tab-count { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 999px; background: rgba(255,255,255,0.25); }
    .subject-tab:not(.active) .tab-count { background: var(--gray-100); color: var(--gray-500); }

    /* ── Toolbar ── */
    .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--gray-400); pointer-events: none; display: flex; align-items: center; }
    .search-input {
      width: 100%; padding: 9px 12px 9px 34px;
      background: var(--gray-50); border: 1.5px solid var(--gray-200);
      border-radius: 9px; font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px; color: var(--gray-800); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--gray-300); }
    .search-input:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(29,92,180,0.1); background: var(--white); }

    .filter-select {
      padding: 9px 14px; background: var(--white);
      border: 1.5px solid var(--gray-200); border-radius: 9px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px;
      color: var(--gray-600); outline: none; transition: border-color 0.2s; cursor: pointer;
    }
    .filter-select:focus { border-color: var(--blue-mid); }

    /* ── Panel ── */
    .panel { background: var(--white); border-radius: 14px; border: 1px solid var(--gray-200); overflow: hidden; box-shadow: 0 2px 10px rgba(16,40,80,0.05); margin-bottom: 20px; }
    .panel-head { padding: 16px 22px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .panel-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 800; color: var(--gray-800); }
    .panel-sub { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

    /* ── Week group headers ── */
    .week-group-label {
      padding: 10px 22px; font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase; color: var(--gray-400);
      background: var(--gray-50); border-bottom: 1px solid var(--gray-100);
    }

    /* ── Material rows ── */
    .material-row {
      display: flex; align-items: center; gap: 13px;
      padding: 14px 22px; border-bottom: 1px solid var(--gray-100);
      transition: background 0.15s; cursor: pointer;
    }
    .material-row:hover { background: var(--gray-50); }
    .material-row:last-child { border-bottom: none; }
    .material-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .material-info { flex: 1; min-width: 0; }
    .material-title { font-size: 13.5px; font-weight: 700; color: var(--gray-800); line-height: 1.3; }
    .material-meta { font-size: 11px; color: var(--gray-400); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .material-meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gray-300); flex-shrink: 0; }

    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .badge-blue   { background: var(--blue-xpale);  color: var(--blue); }
    .badge-green  { background: var(--green-pale);  color: #15803d; }
    .badge-gold   { background: var(--gold-pale);   color: #92400e; }
    .badge-red    { background: var(--red-pale);    color: var(--red); }
    .badge-purple { background: var(--purple-pale); color: var(--purple); }
    .badge-gray   { background: var(--gray-100);    color: var(--gray-500); }

    .material-action {
      flex-shrink: 0; width: 36px; height: 36px; border-radius: 9px;
      background: var(--blue-xpale); color: var(--blue-mid);
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; transition: background 0.15s;
    }
    .material-action:hover { background: var(--blue-pale); }

    /* ── Empty state ── */
    .empty-state { padding: 50px 24px; text-align: center; }
    .empty-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; color: var(--gray-400); }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 800; color: var(--gray-700); margin-bottom: 4px; }
    .empty-sub { font-size: 13px; color: var(--gray-400); }

    @media (max-width: 980px) {
      .main { height: auto; min-height: calc(100vh - 64px); overflow-y: visible; }
      body { overflow-y: auto; }
      .shell { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; width: min(280px, 80vw); height: 100vh; transform: translateX(-100%); z-index: 20; border-right: none; box-shadow: 6px 0 24px rgba(0,0,0,0.18); }
      .sidebar-overlay { display: block; }
      .topbar { flex-wrap: wrap; padding: 16px 20px; }
      .hamburger { display: grid; }
    }
    @media (max-width: 760px) {
      .main { padding: 20px; }
    }
    @media (max-width: 520px) {
      .material-meta { font-size: 10.5px; }
    }
  </style>
</head>
<body>

<!--
  EJS CONVERSION MAP — student-materials.html
  ─────────────────────────────────────────
  - subjects[]      → student's enrolled subjects for active quarter, each with a materialsCount
                       { id, label, dotColor, materialsCount }
  - materials[]      → learning materials for the SELECTED subject, filtered to student's
                       enrolled section, grouped by week:
                       { id, title, type ('pdf'|'pptx'|'video'|'docx'|'image'), week, postedDate, fileUrl }
                       This is read-only for students — no upload/delete actions render here
                       (those exist only on the teacher portal's Learning Materials tab).
  - File download/view → route through GET /student/materials/:id/download (or signed URL),
                       never expose raw storage paths client-side.

  PARTIALS: same sidebar/topbar partials as dashboard + grades (activeNav='materials').

  CLIENT-SIDE BEHAVIOR THAT STAYS:
    - Subject tab switching, search filter, and type filter are pure UI/display logic
      over already-fetched data — fine to keep as JS after conversion UNLESS the
      materials list per subject is large, in which case switching subjects should
      become a real request (GET /student/materials?subject=:id) rather than holding
      every subject's full file list in the page at once.
-->

<div class="shell">
  <div class="sidebar-overlay" id="overlay" onclick="toggleDrawer(false)"></div>

  <!-- ══════ SIDEBAR ══════ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-crest">
        <img src="../../assets/images/edUgnay-logo.png" alt="School logo" onerror="this.style.display='none'"/>
      </div>
      <div class="brand-text">
        <div class="brand-name">Ed<span>Ugnay</span></div>
        <div class="brand-sub">ST. COLUMBAN'S COLLEGE</div>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Main</div>
      <a href="edugnay-student-dashboard.html" class="nav-item">
        <div class="nav-icon"><i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="edugnay-student-grades.html" class="nav-item">
        <div class="nav-icon"><i data-lucide="graduation-cap" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">My Grades</span>
      </a>
      <a href="edugnay-student-materials.html" class="nav-item active">
        <div class="nav-icon"><i data-lucide="folder-open" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">Learning Materials</span>
      </a>
      <a href="edugnay-student-journal.html" class="nav-item">
        <div class="nav-icon"><i data-lucide="notebook-pen" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">Journal Entries</span>
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Communication</div>
      <a href="edugnay-student-announcements.html" class="nav-item">
        <div class="nav-icon"><i data-lucide="megaphone" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">Announcements</span>
        <span class="nav-badge gold">3</span>
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">Account</div>
      <a href="edugnay-student-profile.html" class="nav-item">
        <div class="nav-icon"><i data-lucide="user-round" style="width:16px;height:16px;"></i></div>
        <span class="nav-label">My Profile</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="admin-profile" onclick="location.href='student-profile.html'">
        <div class="admin-avatar">JA</div>
        <div class="admin-info">
          <div class="admin-name">Juan Alcantara</div>
          <div class="admin-role">Grade 7 – St. Matthew</div>
        </div>
        <div class="logout-btn" title="Sign out"><i data-lucide="log-out" style="width:15px;height:15px;"></i></div>
      </div>
    </div>
  </aside>

  <!-- ══════ TOPBAR ══════ -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" type="button" onclick="toggleDrawer(true)">
        <i data-lucide="menu" style="width:18px;height:18px;"></i>
      </button>
      <div>
        <div class="page-eyebrow">EdUgnay · Student</div>
        <div class="page-title">Learning Materials</div>
      </div>
    </div>
    <div class="topbar-right">
      <a href="edugnay-student-dashboard.html" class="top-btn secondary">
        <i data-lucide="layout-dashboard" style="width:14px;height:14px;"></i> <span>Dashboard</span>
      </a>
    </div>
  </header>

  <!-- ══════ MAIN ══════ -->
  <main class="main">

    <div class="accent-bar"></div>

    <!-- subjects[]: loop -->
    <div class="subject-tab-bar" id="subject-tabs">
      <button class="subject-tab active" data-subject="math">
        <span class="subject-tab-dot" style="background:var(--blue-mid);"></span>
        Mathematics
        <span class="tab-count">7</span>
      </button>
      <button class="subject-tab" data-subject="english">
        <span class="subject-tab-dot" style="background:var(--purple);"></span>
        English
        <span class="tab-count">4</span>
      </button>
      <button class="subject-tab" data-subject="science">
        <span class="subject-tab-dot" style="background:#16a34a;"></span>
        Science
        <span class="tab-count">5</span>
      </button>
      <button class="subject-tab" data-subject="filipino">
        <span class="subject-tab-dot" style="background:var(--gold);"></span>
        Filipino
        <span class="tab-count">3</span>
      </button>
      <button class="subject-tab" data-subject="values">
        <span class="subject-tab-dot" style="background:var(--purple);"></span>
        Values Ed
        <span class="tab-count">2</span>
      </button>
    </div>
    <!-- end subjects[] loop -->

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title" id="panel-title">Mathematics — Materials</div>
          <div class="panel-sub" id="panel-sub">Ms. Maria Reyes · 7 files</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon"><i data-lucide="search" style="width:14px;height:14px;"></i></span>
          <input class="search-input" type="text" placeholder="Search materials…" id="search-input" oninput="renderMaterials()"/>
        </div>
        <select class="filter-select" id="type-filter" onchange="renderMaterials()">
          <option value="all">All Types</option>
          <option value="pdf">PDF</option>
          <option value="pptx">Slides</option>
          <option value="video">Video</option>
          <option value="docx">Document</option>
        </select>
      </div>

      <div id="materials-container">
        <!-- JS renders week groups + material rows here -->
      </div>
    </div>

  </main>
</div>

<script>
lucide.createIcons();

/*
  EJS NOTE: MATERIALS_BY_SUBJECT is a client-side placeholder for what becomes
  server-fetched data. On conversion, switching subjects should ideally hit
  GET /student/materials?subject=:id rather than preloading every subject's
  full material list — especially once classes accumulate many files per term.
*/
const MATERIALS_BY_SUBJECT = {
  math: {
    teacher: 'Ms. Maria Reyes',
    items: [
      { id:1, title:'Lesson 1 – Algebra Basics', type:'pdf', quarter:'1st Quarter', date:'June 9, 2025' },
      { id:2, title:'Activity Sheet 1', type:'docx', quarter:'1st Quarter', date:'June 9, 2025' },
      { id:3, title:'Lesson 2 Slides – Equations', type:'pptx', quarter:'1st Quarter', date:'June 10, 2025' },
      { id:4, title:'Quiz 1 Answer Key', type:'pdf', quarter:'1st Quarter', date:'June 12, 2025' },
      { id:5, title:'Solving for X — Video Lesson', type:'video', quarter:'2nd Quarter', date:'June 12, 2025' },
      { id:6, title:'Lesson 3 – Linear Inequalities', type:'pdf', quarter:'2nd Quarter', date:'June 13, 2025' },
      { id:7, title:'Seatwork 2 – Variables', type:'docx', quarter:'2nd Quarter', date:'June 14, 2025' },
    ]
  },
  english: {
    teacher: 'Mr. Paolo Santos',
    items: [
      { id:8,  title:'Reading List – Short Stories', type:'pdf',  quarter:'1st Quarter', date:'June 9, 2025' },
      { id:9,  title:'Grammar Review Slides',        type:'pptx', quarter:'1st Quarter', date:'June 11, 2025' },
      { id:10, title:'Essay Writing Guide',           type:'docx', quarter:'2nd Quarter', date:'June 13, 2025' },
      { id:11, title:'Vocabulary List — Week 3',      type:'pdf',  quarter:'2nd Quarter', date:'June 14, 2025' },
    ]
  },
  science: {
    teacher: 'Mrs. Liza Ramos',
    items: [
      { id:12, title:'Cell Structure Diagram',        type:'pdf',   quarter:'1st Quarter', date:'June 9, 2025' },
      { id:13, title:'Lab Safety Video',              type:'video', quarter:'1st Quarter', date:'June 9, 2025' },
      { id:14, title:'Lesson 2 Slides — Ecosystems', type:'pptx',  quarter:'2nd Quarter', date:'June 11, 2025' },
      { id:15, title:'Worksheet — Food Chains',       type:'docx',  quarter:'2nd Quarter', date:'June 12, 2025' },
      { id:16, title:'Quiz 1 Review Notes',           type:'pdf',   quarter:'2nd Quarter', date:'June 13, 2025' },
    ]
  },
  filipino: {
    teacher: 'Mr. Andres Cruz',
    items: [
      { id:17, title:'Aralin 1 — Pagbasa',    type:'pdf',  quarter:'1st Quarter', date:'June 9, 2025' },
      { id:18, title:'Gawaing Pagsulat',       type:'docx', quarter:'1st Quarter', date:'June 11, 2025' },
      { id:19, title:'Presentasyon — Tula',    type:'pptx', quarter:'2nd Quarter', date:'June 13, 2025' },
    ]
  },
  values: {
    teacher: 'Ms. Maria Reyes',
    items: [
      { id:20, title:'Module 2 — Empathy & Respect', type:'pdf',  quarter:'1st Quarter', date:'June 11, 2025' },
      { id:21, title:'Reflection Guide',              type:'docx', quarter:'2nd Quarter', date:'June 13, 2025' },
    ]
  },
};

let currentSubject = 'math';

const TYPE_META = {
  pdf:   { icon:'file-text',    bg:'var(--red-pale)',    color:'var(--red)',    label:'PDF' },
  pptx:  { icon:'presentation', bg:'var(--gold-pale)',   color:'#92400e',       label:'Slides' },
  video: { icon:'video',        bg:'var(--green-pale)',  color:'#16a34a',       label:'Video' },
  docx:  { icon:'file-text',    bg:'var(--blue-xpale)',  color:'var(--blue-mid)', label:'Document' },
};

function switchSubject(subjectKey, btn) {
  currentSubject = subjectKey;
  document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const data = MATERIALS_BY_SUBJECT[subjectKey];
  const labelMap = { math:'Mathematics', english:'English', science:'Science', filipino:'Filipino', values:'Values Education' };
  document.getElementById('panel-title').textContent = `${labelMap[subjectKey]} — Materials`;
  document.getElementById('panel-sub').textContent = `${data.teacher} · ${data.items.length} files`;

  document.getElementById('search-input').value = '';
  document.getElementById('type-filter').value = 'all';
  renderMaterials();
}

function renderMaterials() {
  const data = MATERIALS_BY_SUBJECT[currentSubject];
  const query = document.getElementById('search-input').value.toLowerCase();
  const typeFilter = document.getElementById('type-filter').value;
  const container = document.getElementById('materials-container');

  const filtered = data.items.filter(m => {
    if (query && !m.title.toLowerCase().includes(query)) return false;
    if (typeFilter !== 'all' && m.type !== typeFilter) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><i data-lucide="search" style="width:22px;height:22px;"></i></div>
        <div class="empty-title">No materials found</div>
        <div class="empty-sub">Try adjusting your search or filter.</div>
      </div>`;
    lucide.createIcons();
    return;
  }

  // Group by quarter
  const quarters = [];
  const grouped = {};
  filtered.forEach(m => {
    if (!grouped[m.quarter]) { grouped[m.quarter] = []; quarters.push(m.quarter); }
    grouped[m.quarter].push(m);
  });

  container.innerHTML = quarters.map(quarter => `
    <div class="week-group-label">${quarter}</div>
    ${grouped[quarter].map(m => {
      const meta = TYPE_META[m.type];
      return `
        <div class="material-row" onclick="downloadMaterial(${m.id})">
          <div class="material-icon" style="background:${meta.bg};">
            <i data-lucide="${meta.icon}" style="width:19px;height:19px;color:${meta.color};"></i>
          </div>
          <div class="material-info">
            <div class="material-title">${m.title}</div>
            <div class="material-meta">
              <span class="badge badge-blue">${meta.label}</span>
              <span class="material-meta-dot"></span>
              <span>Posted ${m.date}</span>
            </div>
          </div>
          <button class="material-action" onclick="event.stopPropagation();downloadMaterial(${m.id})" aria-label="Open material">
            <i data-lucide="${m.type === 'video' ? 'play' : 'download'}" style="width:16px;height:16px;"></i>
          </button>
        </div>`;
    }).join('')}
  `).join('');

  lucide.createIcons();
}

function downloadMaterial(id) {
  // EJS NOTE: replace with real navigation to GET /student/materials/:id/download
  console.log('Open material', id);
}

document.querySelectorAll('.subject-tab').forEach(tab => {
  tab.addEventListener('click', () => switchSubject(tab.dataset.subject, tab));
});

function toggleDrawer(open) {
  const isOpen = open === undefined ? !document.body.classList.contains('drawer-open') : open;
  document.body.classList.toggle('drawer-open', isOpen);
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
    toggleDrawer(false);
  });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleDrawer(false); });

renderMaterials();
</script>

</body>
</html>
