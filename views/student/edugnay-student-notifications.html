<script>
  lucide.createIcons();

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { toggleDrawer(false); }
  });
</script>

<script>

  let activeNotifFilter = 'all';

  function formatDateGroup(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((startOfDay(now) - startOfDay(date)) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  }

  function formatTime(dateStr) {
    return new Date(dateStr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function setNotifFilter(mode, btn) {
    document.querySelectorAll('.notif-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeNotifFilter = mode;
    renderNotifList();
  }

  function markAllRead() {
    NOTIFICATIONS.forEach(n => n.read = true);
    setReadIds(NOTIFICATIONS.map(n => n.id));
    renderNotifList();
  }

  function getFilteredNotifs() {
    return NOTIFICATIONS
      .filter(n => activeNotifFilter === 'unread' ? !n.read : true)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }

  function goToNotif(link, id) {
    const ids = getReadIds();
    if (!ids.includes(id)) { ids.push(id); setReadIds(ids); }
    navigate(link.page);
  }

  function renderNotifList() {
    applyReadState();
    const container = document.getElementById('notifList');
    const emptyState = document.getElementById('notifEmptyState');
    const filtered = getFilteredNotifs();

    if (!filtered.length) {
      container.innerHTML = '';
      const isUnreadEmpty = activeNotifFilter === 'unread' && NOTIFICATIONS.length;
      emptyState.hidden = false;
      emptyState.innerHTML = window.EDUGNAY_CONFIG.renderPanelEmptyState({
        icon: 'bell-off',
        title: isUnreadEmpty ? 'No unread notifications' : 'No notifications yet',
        text: isUnreadEmpty ? "You're all caught up." : "You'll see updates here as they happen."
      });
      if (window.lucide) lucide.createIcons();
      return;
    }
    emptyState.hidden = true;
    emptyState.innerHTML = '';

    let html = '';
    let lastGroup = null;

    filtered.forEach(n => {
      const group = formatDateGroup(n.created_at);
      if (group !== lastGroup) {
        html += `<div class="notif-group-label">${group}</div>`;
        lastGroup = group;
      }
      html += `
        <div class="notif-item ${n.read ? '' : 'unread'}" onclick='goToNotif(${JSON.stringify(n.link)}, ${n.id})'>
          <div class="nt-icon ${n.color}"><i data-lucide="${n.icon}" style="width:15px;height:15px;"></i></div>
          <div class="nt-body">
            <div class="nt-text"><strong>${n.title}</strong></div>
            <div class="nt-desc">${n.desc}</div>
            <div class="nt-time">${formatTime(n.created_at)}</div>
          </div>
          <span class="nt-tag">${n.tag}</span>
        </div>
      `;
    });

    container.innerHTML = html;
    lucide.createIcons();
  }

  renderNotifList();
</script>
</body>
