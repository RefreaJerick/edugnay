<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/page-events.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration submitted | Academix</title>
  <link rel="icon" href="../../assets/images/edUgnay-logo-circle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css?v=2">
  <link rel="stylesheet" href="../../assets/css/onboarding.css">
  <script src="../../assets/vendor/lucide/lucide-1.62.0.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/shell-common.js?v=10"></script>
  <link rel="stylesheet" href="../../assets/css/theme.css">
</head>
<body data-public-page="true">
  <main class="onboarding-page onboarding-pending-page">
    <header class="onboarding-topbar">
      <a class="onboarding-topbar-brand" href="../../index.html" aria-label="Academix home">
        <img src="../../assets/images/edUgnay-logo-circle.png" alt="" aria-hidden="true" />
        <span>Acade<span>Mix</span></span>
      </a>
      <nav class="onboarding-topbar-actions" aria-label="Confirmation navigation">
        <div class="tb-theme" data-theme-control>
          <button class="tb-theme-trigger" type="button" data-theme-trigger aria-label="Switch to dark mode" title="Switch to dark mode"><i data-lucide="moon" aria-hidden="true"></i></button>
        </div>
        <a class="onboarding-topbar-signin" href="../../index.html">Back to sign in</a>
      </nav>
    </header>

    <section class="onboarding-pending" aria-labelledby="pendingRegistrationTitle">
      <div class="onboarding-pending-intro">
        <p class="onboarding-showcase-kicker">School onboarding</p>
        <h1 id="pendingRegistrationTitle">Checking registration status...</h1>
        <p id="pendingRegistrationMessage">Your saved registration status is being loaded.</p>
      </div>

      <div class="onboarding-card pending-registration-card">
        <div class="onboarding-form-head">
          <div class="pending-registration-heading">
            <span class="onboarding-section-icon" aria-hidden="true">
              <i data-lucide="clock-3"></i>
            </span>
            <div>
              <h2 id="pendingRegistrationState"></h2>
              <p id="pendingRegistrationStateMessage">Please wait while we retrieve the latest status.</p>
            </div>
          </div>
        </div>

        <div class="pending-registration-content">
          <p class="pending-registration-intro" id="pendingRegistrationIntro">We will send updates to the masked notification address shown below.</p>

          <dl class="pending-registration-details">
            <div>
              <dt>School</dt>
              <dd id="pendingSchoolName"></dd>
            </div>
            <div>
              <dt>Notification email</dt>
              <dd id="pendingNotificationEmail"></dd>
            </div>
            <div>
              <dt>Administrator login email</dt>
              <dd id="pendingAdministratorSchoolEmail"></dd>
            </div>
          </dl>
          <p class="pending-registration-error" id="pendingRegistrationError" role="alert" hidden></p>
          <div class="pending-registration-actions">
            <button class="onboarding-submit" id="pendingRegistrationResubmit" type="button" hidden>Revise and resubmit</button>
            <button class="onboarding-submit" id="pendingRegistrationRetry" type="button" hidden>Try again</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../assets/js/onboarding/registration-pending.js"></script>
</body>
</html>
